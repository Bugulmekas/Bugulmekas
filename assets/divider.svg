<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="26" viewBox="0 0 1000 26">

  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="55%" stop-color="#7A5CFF"/>
      <stop offset="100%" stop-color="#FF2BD6"/>
    </linearGradient>
    <linearGradient id="neonV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF2BD6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E1626"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <radialGradient id="haloC">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#00F5FF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloM">
      <stop offset="0%" stop-color="#FF2BD6" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#FF2BD6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FF2BD6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1C2B45" stroke-width="1" stroke-opacity="0.55"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
  </defs>
  <rect width="1000" height="26" fill="#0D1117"/>
  <line x1="0" y1="13" x2="440" y2="13" stroke="url(#neon)" stroke-width="1.5" opacity="0.55"/>
  <line x1="560" y1="13" x2="1000" y2="13" stroke="url(#neon)" stroke-width="1.5" opacity="0.55"/>
  <path d="M500 5l8 8-8 8-8-8z" fill="#0D1117" stroke="#00F5FF" stroke-width="1.6" filter="url(#soft)"/>
  <circle cx="440" cy="13" r="2" fill="#FF2BD6"/>
  <circle cx="560" cy="13" r="2" fill="#FF2BD6"/>
</svg>
