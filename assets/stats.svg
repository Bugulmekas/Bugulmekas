<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="160" viewBox="0 0 1000 160">

  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="55%" stop-color="#7A5CFF"/>
      <stop offset="100%" stop-color="#FF2BD6"/>
    </linearGradient>
    <linearGradient id="neonV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF2BD6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E1626"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <radialGradient id="haloC">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#00F5FF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloM">
      <stop offset="0%" stop-color="#FF2BD6" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#FF2BD6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FF2BD6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1C2B45" stroke-width="1" stroke-opacity="0.55"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
  </defs>
  <rect width="1000" height="160" fill="#0D1117"/>
  
    <g>
      <rect x="16" y="16" width="230" height="128" rx="12" fill="url(#panel)" stroke="#1C2B45"/>
      <path d="M32 16H94" stroke="#00F5FF" stroke-width="2.5" filter="url(#soft)"/>
      <text x="34" y="46" fill="#7C8DA6" font-size="11" letter-spacing="4">REPOS</text>
      <text x="34" y="98" fill="#E7F2FF" font-size="46" font-weight="700" filter="url(#glow)">5</text>
      <text x="34" y="124" fill="#00F5FF" font-size="11" letter-spacing="2" opacity="0.85">публичных</text>
    </g>
    <g>
      <rect x="263" y="16" width="230" height="128" rx="12" fill="url(#panel)" stroke="#1C2B45"/>
      <path d="M279 16H341" stroke="#FF2BD6" stroke-width="2.5" filter="url(#soft)"/>
      <text x="281" y="46" fill="#7C8DA6" font-size="11" letter-spacing="4">COMMITS</text>
      <text x="281" y="98" fill="#E7F2FF" font-size="46" font-weight="700" filter="url(#glow)">45</text>
      <text x="281" y="124" fill="#FF2BD6" font-size="11" letter-spacing="2" opacity="0.85">за год</text>
    </g>
    <g>
      <rect x="510" y="16" width="230" height="128" rx="12" fill="url(#panel)" stroke="#1C2B45"/>
      <path d="M526 16H588" stroke="#7A5CFF" stroke-width="2.5" filter="url(#soft)"/>
      <text x="528" y="46" fill="#7C8DA6" font-size="11" letter-spacing="4">STARS</text>
      <text x="528" y="98" fill="#E7F2FF" font-size="46" font-weight="700" filter="url(#glow)">2</text>
      <text x="528" y="124" fill="#7A5CFF" font-size="11" letter-spacing="2" opacity="0.85">набрано</text>
    </g>
    <g>
      <rect x="757" y="16" width="230" height="128" rx="12" fill="url(#panel)" stroke="#1C2B45"/>
      <path d="M773 16H835" stroke="#00F5FF" stroke-width="2.5" filter="url(#soft)"/>
      <text x="775" y="46" fill="#7C8DA6" font-size="11" letter-spacing="4">FOLLOWERS</text>
      <text x="775" y="98" fill="#E7F2FF" font-size="46" font-weight="700" filter="url(#glow)">0</text>
      <text x="775" y="124" fill="#00F5FF" font-size="11" letter-spacing="2" opacity="0.85">подписчиков</text>
    </g>
</svg>
